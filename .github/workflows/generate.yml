name: Weekly batch generate

# Writes several bilingual stories in ONE batch (once a week, off-peak,
# outside the publish window) and queues them as `ready` rows in the Sheet
# -- instead of calling Gemini at every single daily publish moment. See
# src/generate.mjs.
#
# Manual "dashboard": use this workflow's own "Run workflow" button (Actions
# tab) to generate on demand, with a custom count -- no separate UI needed.
on:
  schedule:
    # Every Wednesday, 10:00 UTC (17:00 WIB) -- between this project's
    # publish window and the sibling projects', so it never competes with
    # any of them for the same shared Gemini API key's rate limit.
    - cron: "0 10 * * WED"
  workflow_dispatch:
    inputs:
      count:
        description: "How many articles to generate"
        required: false
        default: "10"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run weekly batch generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          PUBLISH_TIMEZONE: ${{ secrets.PUBLISH_TIMEZONE }}
          GENERATE_COUNT: ${{ github.event.inputs.count || '10' }}
        run: npm run generate
